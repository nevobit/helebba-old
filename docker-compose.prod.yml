version: "3.9"

services:
  corehub-api:
    build:
      context: . 
      dockerfile: ./apps/http-api/Dockerfile
    image: helebba-api:latest
    ports:
      - "8000:8000"
    env_file:
      - ./apps/http-api/.env
    environment:
      NODE_ENV: production
    networks:
      - app_network

networks:
  app_network:
    driver: bridge 